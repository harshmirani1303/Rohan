
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Rohan🎂</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  height: 100vh;
  background:
    radial-gradient(ellipse at 50% 40%, #52243f 0%, #241225 45%, #090711 100%);
  color: white;
  font-family: Georgia, serif;
}

.scene {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* BACKGROUND GLOW */

.glow {
  position: absolute;
  width: 380px;
  height: 380px;
  top: 8%;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: #ff6fae;
  filter: blur(110px);
  opacity: .18;
  animation: glowPulse 4s infinite alternate;
}

@keyframes glowPulse {
  from { opacity: .12; transform: translateX(-50%) scale(.8); }
  to   { opacity: .3; transform: translateX(-50%) scale(1.15); }
}

/* STARS */

.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.star {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #fff1d6;
  box-shadow: 0 0 8px #ffc2dd;
  animation: twinkle var(--duration) ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: .15; transform: scale(.6); }
  to { opacity: 1; transform: scale(1.5); }
}

/* CAKE AREA */

.cake-area {
  position: absolute;
  top: 7%;
  width: min(420px, 94vw);
  height: 390px;
}

/* CAKE PIECES FALL FROM ABOVE */

.piece {
  position: absolute;
  left: 50%;
  opacity: 0;
  transform: translate(-50%, -700px) rotate(-15deg);
  animation: dropIntoPlace 1.2s cubic-bezier(.17,.67,.23,1.2) forwards;
}

@keyframes dropIntoPlace {
  0% {
    opacity: 0;
    transform: translate(-50%, -700px) rotate(-20deg);
  }
  65% { opacity: 1; }
  82% {
    transform: translate(-50%, 12px) rotate(3deg);
  }
  92% {
    transform: translate(-50%, -7px) rotate(-1deg);
  }
  100% {
    opacity: 1;
    transform: translate(-50%, 0) rotate(0deg);
  }
}

/* BOTTOM CAKE TIER */

.bottom-tier {
  width: 300px;
  height: 100px;
  top: 190px;
  z-index: 2;
  animation-delay: 1.5s;
}

.tier-body {
  position: absolute;
  inset: 0;
  border-radius: 8px 8px 18px 18px;
  background:
    linear-gradient(90deg,
      #9c345b 0%,
      #f8a4bf 18%,
      #ffe0df 36%,
      #f5a1bd 58%,
      #a83b65 100%);
  box-shadow:
    inset 0 8px 8px #ffffff55,
    inset 0 -12px 15px #7d234755,
    0 14px 20px #0006;
}

.tier-top {
  position: absolute;
  width: 100%;
  height: 35px;
  top: -17px;
  border-radius: 50%;
  background: linear-gradient(180deg, #fff0e9, #f5b1c9 75%);
  border-bottom: 4px solid #d96891;
}

.frosting-drips {
  position: absolute;
  top: -6px;
  left: 0;
  width: 100%;
  height: 36px;
  border-top: 8px solid #fff0e7;
  border-radius: 15px 15px 0 0;
  background:
    radial-gradient(ellipse 12px 20px at 10% 0%, #fff0e7 95%, transparent 100%),
    radial-gradient(ellipse 14px 25px at 30% 0%, #fff0e7 95%, transparent 100%),
    radial-gradient(ellipse 11px 22px at 52% 0%, #fff0e7 95%, transparent 100%),
    radial-gradient(ellipse 14px 20px at 75% 0%, #fff0e7 95%, transparent 100%),
    radial-gradient(ellipse 12px 22px at 94% 0%, #fff0e7 95%, transparent 100%);
}

.cream-dots {
  position: absolute;
  top: 37px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
}

.cream-dots span {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, white, #ffc9dc 65%, #e77ca3);
  box-shadow: 0 2px 4px #70213d77;
}

/* MIDDLE TIER */

.middle-tier {
  width: 235px;
  height: 78px;
  top: 116px;
  z-index: 3;
  animation-delay: .85s;
}

.middle-tier .tier-body {
  background: linear-gradient(90deg, #b84670, #fff0e7 28%, #ffd5dd 50%, #e77ca4 75%, #a83b65);
}

.middle-tier .tier-top {
  background: linear-gradient(180deg, #fffaf0, #ffd6dc);
  border-bottom-color: #e28ca8;
}

/* TOP TIER */

.top-tier {
  width: 160px;
  height: 62px;
  top: 60px;
  z-index: 4;
  animation-delay: .25s;
}

.top-tier .tier-body {
  background: linear-gradient(90deg, #a83b65, #f9b1c9 24%, #fff0e8 48%, #f6a6c0 75%, #a83b65);
}

.top-tier .tier-top {
  background: linear-gradient(180deg, white, #ffdbdf);
}

/* PLATE */

.plate {
  position: absolute;
  top: 280px;
  left: 50%;
  width: 345px;
  height: 28px;
  transform: translate(-50%, -500px);
  opacity: 0;
  z-index: 1;
  border-radius: 50%;
  background: linear-gradient(180deg, #fff9f5, #d5a6b9 55%, #fff0f5);
  box-shadow: 0 12px 20px #0007;
  animation: plateDrop 1.2s 2s cubic-bezier(.17,.67,.23,1.2) forwards;
}

@keyframes plateDrop {
  0% { opacity: 0; transform: translate(-50%, -500px) rotate(-6deg); }
  75% { opacity: 1; transform: translate(-50%, 8px) rotate(2deg); }
  90% { transform: translate(-50%, -4px) rotate(-1deg); }
  100% { opacity: 1; transform: translate(-50%, 0) rotate(0); }
}

/* CANDLES */

.candles {
  position: absolute;
  z-index: 5;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 24px;
}

.candle {
  width: 9px;
  height: 42px;
  position: relative;
  border-radius: 3px 3px 1px 1px;
  background: repeating-linear-gradient(
    135deg,
    #fff3df 0px,
    #fff3df 5px,
    #ee80ac 5px,
    #ee80ac 9px
  );
  box-shadow: inset -2px 0 2px #b13e6b66;
  transform: translateY(-400px);
  animation: candleDrop .75s 2.5s ease-out forwards;
}

.candle:nth-child(2) {
  animation-delay: 2.65s;
}

.candle:nth-child(3) {
  animation-delay: 2.8s;
}

@keyframes candleDrop {
  to { transform: translateY(0); }
}

.wick {
  position: absolute;
  width: 2px;
  height: 8px;
  background: #32202b;
  left: 50%;
  top: -7px;
  transform: translateX(-50%);
}

.flame {
  position: absolute;
  width: 15px;
  height: 23px;
  left: 50%;
  top: -29px;
  transform: translateX(-50%) scale(0);
  transform-origin: bottom;
  border-radius: 50% 50% 45% 45%;
  background: linear-gradient(to top, #ff7000, #ffcf58 60%, #fff9cf);
  box-shadow: 0 0 12px #ffac36, 0 0 30px #ff8a39aa;
  animation: ignite .35s 3.3s ease-out forwards, flicker .13s 3.65s infinite alternate;
}

@keyframes ignite {
  from { transform: translateX(-50%) scale(0); }
  to { transform: translateX(-50%) scale(1); }
}

@keyframes flicker {
  from { transform: translateX(-50%) rotate(-5deg) scale(1); }
  to { transform: translateX(-50%) rotate(5deg) scale(1.12,.92); }
}

/* TITLE */

.message {
  position: absolute;
  top: 65%;
  width: 100%;
  text-align: center;
  padding: 0 10px;
  opacity: 0;
  transform: translateY(35px) scale(.85);
  animation: revealMessage 1.5s 3.8s ease-out forwards;
}

@keyframes revealMessage {
  0% {
    opacity: 0;
    transform: translateY(35px) scale(.85);
    filter: blur(10px);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

.message h1 {
  font-family: 'Great Vibes', cursive;
  font-weight: 400;
  font-size: clamp(42px, 9vw, 76px);
  line-height: 1.18;
  color: #ffd5e5;
  text-shadow:
    0 0 8px #ff7daf,
    0 0 24px #ff4f9d77,
    0 4px 4px #0007;
}

.message p {
  font-family: 'Cormorant Garamond', serif;
  text-transform: uppercase;
  letter-spacing: 6px;
  font-size: clamp(10px, 2.6vw, 15px);
  color: #ffcee0;
  margin-top: 8px;
  opacity: .85;
}

/* FLOATING HEARTS */

.heart {
  position: absolute;
  bottom: -50px;
  color: #ff8db9;
  opacity: 0;
  pointer-events: none;
  animation: floatHeart var(--speed) linear forwards;
  text-shadow: 0 0 12px #ff4388;
}

@keyframes floatHeart {
  0% {
    transform: translateY(0) rotate(0deg) scale(.7);
    opacity: 0;
  }
  15% { opacity: .8; }
  80% { opacity: .6; }
  100% {
    transform: translateY(-115vh) rotate(45deg) scale(1.3);
    opacity: 0;
  }
}

/* FALLING DECORATIONS */

.berry {
  position: absolute;
  left: 50%;
  top: -80px;
  font-size: 27px;
  z-index: 8;
  opacity: 0;
  animation: berryDrop 1s var(--delay) cubic-bezier(.2,.7,.25,1.2) forwards;
}

@keyframes berryDrop {
  0% { opacity: 0; transform: translate(-50%, -300px) rotate(-90deg); }
  70% { opacity: 1; transform: translate(-50%, 6px) rotate(20deg); }
  85% { transform: translate(-50%, -3px) rotate(-8deg); }
  100% { opacity: 1; transform: translate(-50%, 0) rotate(0); }
}

/* REPLAY BUTTON */

.replay {
  position: absolute;
  bottom: 22px;
  padding: 10px 22px;
  border: 1px solid #ffbad6;
  border-radius: 30px;
  background: #ffffff0b;
  color: #ffd9e8;
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
  opacity: 0;
  animation: showButton 1s 5s forwards;
  transition: .3s;
}

.replay:hover {
  background: #ff8db933;
  box-shadow: 0 0 20px #ff8db944;
}

@keyframes showButton {
  to { opacity: .8; }
}

@media (max-height: 650px) {
  .cake-area { top: 1%; transform: scale(.76); transform-origin: top center; }
  .message { top: 62%; }
  .message h1 { font-size: clamp(38px, 7vw, 60px); }
}

@media (max-width: 400px) {
  .cake-area { transform: scale(.82); transform-origin: top center; }
  .message { top: 61%; }
  .message h1 { font-size: 45px; }
  .message p { letter-spacing: 3px; }
}
</style>
</head>

<body>
<div class="scene" id="scene">

  <div class="glow"></div>
  <div class="stars" id="stars"></div>

  <div class="cake-area">

    <!-- Cake plate -->
    <div class="plate"></div>

    <!-- Bottom tier falls first -->
    <div class="piece bottom-tier">
      <div class="tier-body">
        <div class="frosting-drips"></div>
        <div class="cream-dots">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="tier-top"></div>
    </div>

    <!-- Middle tier -->
    <div class="piece middle-tier">
      <div class="tier-body">
        <div class="frosting-drips"></div>
        <div class="cream-dots">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span>
        </div>
      </div>
      <div class="tier-top"></div>
    </div>

    <!-- Top tier -->
    <div class="piece top-tier">
      <div class="tier-body"></div>
      <div class="tier-top"></div>
    </div>

    <!-- Candles -->
    <div class="candles">
      <div class="candle">
        <div class="wick"></div>
        <div class="flame"></div>
      </div>
      <div class="candle">
        <div class="wick"></div>
        <div class="flame"></div>
      </div>
      <div class="candle">
        <div class="wick"></div>
        <div class="flame"></div>
      </div>
    </div>

    <!-- Strawberries falling into position -->
    <div class="berry" style="left:32%;top:130px;--delay:3s">🍓</div>
    <div class="berry" style="left:67%;top:130px;--delay:3.15s">🍓</div>

  </div>

  <!-- Birthday message -->
  <div class="message">
    <h1>Happy Birthday<br>Rohan</h1>
    <p>Made with html, just for you ♥</p>
  </div>

  <button class="replay" onclick="replayAnimation()">
    ↻ &nbsp; WATCH AGAIN
  </button>

</div>

<script>
const scene = document.getElementById('scene');
const stars = document.getElementById('stars');

/* Generate background stars */
for (let i = 0; i < 90; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.setProperty('--duration', (1 + Math.random() * 3) + 's');
  star.style.animationDelay = Math.random() * 4 + 's';

  const size = 1 + Math.random() * 2.5;
  star.style.width = size + 'px';
  star.style.height = size + 'px';

  stars.appendChild(star);
}

/* Hearts continuously float upward */
function createHeart() {
  const heart = document.createElement('div');
  heart.className = 'heart';

  const symbols = ['♥', '♡', '❤', '✧', '💕'];
  heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];

  heart.style.left = Math.random() * 100 + '%';
  heart.style.fontSize = (12 + Math.random() * 22) + 'px';

  const speed = 5 + Math.random() * 7;
  heart.style.setProperty('--speed', speed + 's');

  scene.appendChild(heart);

  setTimeout(() => heart.remove(), speed * 1000);
}

let heartTimer = setInterval(createHeart, 450);

/* Replay the full animation */
function replayAnimation() {
  clearInterval(heartTimer);

  document.querySelectorAll('.heart').forEach(el => el.remove());

  const animatedElements = document.querySelectorAll(
    '.piece, .plate, .candle, .flame, .berry, .message, .replay'
  );

  animatedElements.forEach(el => {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  });

  heartTimer = setInterval(createHeart, 450);
}

/* Start with a few hearts */
for (let i = 0; i < 12; i++) {
  setTimeout(createHeart, i * 180);
}
</script>
</body>
</html>
